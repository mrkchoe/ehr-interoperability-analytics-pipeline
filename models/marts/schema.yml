version: 2

models:
  - name: patient_summary
    columns:
      - name: patient_id
        tests:
          - not_null
          - unique

  - name: encounter_counts
    columns:
      - name: month_start
        tests:
          - not_null

  - name: observation_trends
    columns:
      - name: observation_date
        tests:
          - not_null

  - name: records_by_source
    columns:
      - name: entity
        tests:
          - not_null
      - name: source_system
        tests:
          - not_null
      - name: record_count
        tests:
          - not_null
